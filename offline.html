<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#2563eb">
    <title>Offline - Todo List</title>
    <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
    <style>
        :root{
            --bg: #eef4ff;
            --card: #ffffff;
            --text: #1e293b;
            --muted: #475569;
            --primary: #2563eb;
        }

        @media (prefers-color-scheme: dark){
            :root{
                --bg: #0f172a;
                --card: #1e293b;
                --text: #f1f5f9;
                --muted: #cbd5e1;
                --primary: #60a5fa;
            }
        }

        *{
            box-sizing: border-box;
        }

        body{
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            font-family: Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
        }

        main{
            max-width: 460px;
            padding: 40px 30px;
            text-align: center;
            background-color: var(--card);
            border-radius: 14px;
            box-shadow: 0 6px 24px rgba(37, 99, 235, 0.15);
        }

        img{
            width: 96px;
            height: 96px;
        }

        h1{
            margin: 20px 0 10px;
            color: var(--primary);
        }

        p{
            margin: 0 0 22px;
            line-height: 1.6;
            color: var(--muted);
        }

        a, button{
            display: inline-block;
            padding: 11px 20px;
            font: inherit;
            font-weight: bold;
            color: #fff;
            background-color: #2563eb;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            text-decoration: none;
        }

        a:focus-visible, button:focus-visible{
            outline: 3px solid #f59e0b;
            outline-offset: 2px;
        }
    </style>
</head>

<body>
    <main>
        <img src="icons/icon-192.png" alt="" width="96" height="96">
        <h1>Kamu sedang offline</h1>
        <p>
            Halaman ini belum pernah dibuka sebelumnya, jadi belum tersimpan di perangkat.
            Sambungkan kembali internet lalu coba lagi. Halaman todo yang sudah pernah dibuka
            tetap bisa diakses tanpa koneksi.
        </p>
        <button type="button" id="retry">Coba Lagi</button>
        <a href="index.php?page=personal">Ke Todo Personal</a>
    </main>

    <script>
        document.getElementById("retry").addEventListener("click", function(){
            location.reload();
        });

        window.addEventListener("online", function(){
            location.href = "index.php?page=personal";
        });
    </script>
</body>

</html>
