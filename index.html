<!DOCTYPE html>
<html>
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Todo List</title>
        <link rel="stylesheet" href="style.css">
    </head>

    <body>
        <header>
            <h1>Todo List</h1>
        </header>


        <main>
            <div class="content">
                <section class="todo-list">
                <h2>My Todos</h2>

                <div class="todo-item">
                    <h3>Belajar html</h3>
                    <p>Mempelajari semantic html</p>
                </div>

                <div class="todo-item">
                    <h3>Belajar CSS</h3>
                    <p>Mempelajari flexbox dan grid</p>
                </div>
                </section>

                <section class="todo-detail">
                    <h2>Todo Detail</h2>

                    <h3>Belajar HTML</h3>

                    <p>Mempelajari semanctic HTML dan membuat struktur halaman menggunakan HTML</p>
                    <p>Status: In progress</p>
                </section>
            </div>

            <aside class="todo-form">
                <h2>New Todo</h2>

                <form>
                    <label for="title">Title</label>
                    <input type="text" id="title" name="title">

                    <label for="description">Description</label>
                    <textarea id="description" name="description"></textarea>

                    <button type="submit">Add Todo</button>
                </form>
            </aside>
        </main>


        <footer>
            <p>Todo List</p>
        </footer>
    </body>
</html>
